# ==============================================================================
# IQAC SaaS — Production-Grade Multi-Container Docker Compose Environment
# ==============================================================================
services:
  # ----------------------------------------------------------------------------
  # PostgreSQL Database Service
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: iqac_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-iqac_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_secure_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-iqac_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - iqac_internal

  # ----------------------------------------------------------------------------
  # Redis Cache & Background Queue Service
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: iqac_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - iqac_internal

  # ----------------------------------------------------------------------------
  # Django Backend Service (Gunicorn WSGI)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: iqac_backend
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-iqac_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres_secure_pass}
      REDIS_URL: redis://redis:6379/1
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-super-secret-key-minimum-50-chars}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1}
      AI_ENABLED: ${AI_ENABLED:-True}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
      - backups_data:/app/backups
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health/"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - iqac_internal

  # ----------------------------------------------------------------------------
  # Frontend & Reverse Proxy (Nginx)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: iqac_web
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_data:/app/staticfiles:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - iqac_internal

# ------------------------------------------------------------------------------
# Persistent Storage Volumes
# ------------------------------------------------------------------------------
volumes:
  postgres_data:
  redis_data:
  media_data:
  static_data:
  backups_data:

# ------------------------------------------------------------------------------
# Isolated Internal Network
# ------------------------------------------------------------------------------
networks:
  iqac_internal:
    driver: bridge
